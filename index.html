<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DanceApp</title>
<!--
  Cast Web Receiver for DanceApp: plays the level video and draws the game on top of it.
  The tablet sends what to draw over the custom namespace below; everything time-based here
  (cues sliding to their target, the progress bar) runs off this device's own playback clock,
  so it stays in sync with the picture.
  Everything is plain elements: on Android TV Cast devices the video plane covers <canvas>.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap&subset=cyrillic" rel="stylesheet">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  :root { --pink: #FF4081; --cyan: #00E5FF; --gold: #FFD740; --green: #76FF03; --red: #FF5252; }
  html, body { margin: 0; height: 100%; background: #07060f; overflow: hidden; color: #fff;
               font-family: Rubik, Roboto, "Noto Sans", sans-serif; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

  /* ---------- Menu ---------- */
  #idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 2.2vh; overflow: hidden; background: radial-gradient(ellipse at 50% 120%, #2a0f4a 0%, #0b0820 55%, #05040c 100%); }
  .blob { position: absolute; width: 60vh; height: 60vh; border-radius: 50%; filter: blur(9vh); opacity: .45; }
  .blob.a { background: var(--pink); left: -15vh; top: -10vh; animation: drift 14s ease-in-out infinite alternate; }
  .blob.b { background: #6a3cff; right: -20vh; bottom: -15vh; animation: drift 17s ease-in-out infinite alternate-reverse; }
  .blob.c { background: var(--cyan); left: 40%; top: 55%; width: 40vh; height: 40vh; opacity: .25; animation: drift 20s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(18vh, 12vh) scale(1.25); } }
  #idle > *:not(.blob) { position: relative; }
  .logo { font-size: 11vh; font-weight: 900; letter-spacing: -.2vh; margin: 0;
          background: linear-gradient(90deg, var(--cyan), #b388ff 45%, var(--pink)); -webkit-background-clip: text; color: transparent;
          filter: drop-shadow(0 0 2.5vh rgba(255, 64, 129, .45)); animation: breathe 3.5s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.03); } }
  #status { font-size: 3vh; opacity: .7; margin: 0; }
  #menu { display: flex; flex-direction: column; gap: 1.4vh; width: 62vw; margin-top: 1vh; }
  .song { display: flex; justify-content: space-between; align-items: center; gap: 3vw; padding: 2vh 2.8vw;
          border-radius: 2vh; background: rgba(255,255,255,.06); border: .35vh solid rgba(255,255,255,.08);
          font-size: 3.8vh; font-weight: 500; transition: transform .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .song .meta { display: flex; flex-direction: column; gap: .4vh; }
  .song .duration { font-size: 2.4vh; opacity: .5; font-weight: 400; }
  .song .who { font-size: 2.8vh; opacity: .5; white-space: nowrap; }
  .song.selected { transform: scale(1.04); background: linear-gradient(90deg, rgba(0,229,255,.18), rgba(255,64,129,.18));
                   border-color: rgba(255,255,255,.85); box-shadow: 0 0 4vh rgba(255, 64, 129, .35); }
  .song.selected .who { opacity: 1; color: var(--gold); font-weight: 700; }
  .hint { font-size: 2.3vh; opacity: .5; margin-top: 1.5vh; }
  .key { display: inline-block; padding: .2vh 1vh; border: .25vh solid rgba(255,255,255,.5); border-radius: .8vh; margin: 0 .5vh; }

  /* ---------- In game ---------- */
  #progress { position: absolute; left: 0; top: 0; height: .9vh; width: 100%; background: rgba(255,255,255,.12); display: none; }
  #progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--pink)); box-shadow: 0 0 1.5vh var(--pink); }
  #scores { position: absolute; top: 2.5vh; left: 50%; transform: translateX(-50%); display: none; gap: 2.5vw; }
  .scorecard { display: flex; flex-direction: column; align-items: center; min-width: 16vw; padding: 1vh 2vw 1.2vh;
               background: rgba(5, 4, 15, .62); border-radius: 2vh; border-top: .6vh solid currentColor; }
  .scorecard .points { font-size: 6.5vh; font-weight: 900; color: #fff; line-height: 1.05; }
  .scorecard .combo { font-size: 2.4vh; font-weight: 700; letter-spacing: .3vh; opacity: 0; transition: opacity .2s; }
  .scorecard .combo.on { opacity: 1; }
  .scorecard.bump .points { animation: bump .35s ease-out; }
  @keyframes bump { 30% { transform: scale(1.18); } }

  .strip { position: absolute; inset: 0; pointer-events: none; }
  .target { position: absolute; border-style: solid; box-sizing: border-box; }
  .target.flash { animation: flash .5s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 5vh 1.5vh var(--flash), inset 0 0 4vh var(--flash); } }
  .cue { position: absolute; display: none; background: rgba(5,4,15,.6); }
  .cue svg { width: 100%; height: 100%; stroke: currentColor; fill: currentColor; stroke-width: 6; stroke-linecap: round; }

  .popup { position: absolute; top: 24vh; width: 50%; text-align: center; font-size: 9.5vh; font-weight: 900; opacity: 0;
           letter-spacing: -.2vh; pointer-events: none; }
  .popup.solo { left: 25%; }
  /* Pulled in towards the middle, clear of the cue strips at the edges */
  .popup.left { left: 6%; width: 44%; }
  .popup.right { left: 50%; width: 44%; }
  .popup span { display: inline-block; color: var(--c); text-shadow: 0 0 2vh var(--c), 0 .6vh 1.5vh #000; }
  .popup.show { animation: pop 1.2s cubic-bezier(.2, 1.4, .4, 1) forwards; }
  .popup.show.miss { animation: popmiss 1s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(.3) rotate(-8deg); opacity: 0; } 15% { transform: scale(1.15) rotate(2deg); opacity: 1; }
                   30% { transform: scale(1) rotate(0); } 70% { opacity: 1; } 100% { transform: translateY(-4vh); opacity: 0; } }
  @keyframes popmiss { 0% { opacity: 0; } 10% { opacity: 1; transform: translateX(-2vh); } 20% { transform: translateX(2vh); }
                       30% { transform: translateX(-1vh); } 40% { transform: translateX(0); } 70% { opacity: .9; } 100% { opacity: 0; transform: translateY(3vh); } }
  .spark { position: absolute; width: 4vh; height: 4vh; margin: -2vh 0 0 -2vh; pointer-events: none; font-size: 4.2vh;
           line-height: 4vh; text-align: center; color: var(--c); text-shadow: 0 0 1.2vh var(--c), 0 0 .3vh #000;
           animation: spark .8s cubic-bezier(.1, .7, .3, 1) forwards; }
  @keyframes spark { 0% { transform: translate(0, 0) scale(1.6); opacity: 1; } 65% { opacity: 1; }
                     100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(.6); opacity: 0; } }

  #comboflash { position: absolute; left: 0; right: 0; top: 40vh; text-align: center; font-size: 13vh; font-weight: 900;
                pointer-events: none; opacity: 0; }
  #comboflash.show { animation: combo 1.4s ease-out forwards; }
  @keyframes combo { 0% { transform: scale(2.5); opacity: 0; letter-spacing: 4vh; } 20% { transform: scale(1); opacity: 1; letter-spacing: 0; }
                     75% { opacity: 1; } 100% { transform: scale(.9); opacity: 0; } }
  #comboflash span { background: linear-gradient(90deg, var(--gold), var(--pink), var(--cyan)); -webkit-background-clip: text; color: transparent;
                     filter: drop-shadow(0 .4vh .3vh rgba(0, 0, 0, .9)) drop-shadow(0 0 2vh rgba(255, 215, 64, .6)); }
  #edge { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 12vh 3vh var(--c); }
  #edge.show { animation: edge 1.2s ease-out; }
  @keyframes edge { 20% { opacity: 1; } 100% { opacity: 0; } }

  #intro { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
           background: radial-gradient(ellipse at center, rgba(10, 6, 30, .85), rgba(0,0,0,.4)); pointer-events: none; }
  #intro.show { display: flex; animation: intro 3s ease-in-out forwards; }
  @keyframes intro { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  #intro h1 { font-size: 10vh; font-weight: 900; margin: 0; animation: slidein .8s cubic-bezier(.2, 1.3, .4, 1); }
  #intro p { font-size: 3.4vh; margin: 0; opacity: .8; }
  @keyframes slidein { from { transform: translateY(6vh); opacity: 0; } }

  .presence { position: absolute; bottom: 4vh; width: 50%; text-align: center; font-size: 3.4vh; font-weight: 700; display: none; }
  .presence span { background: rgba(5,4,15,.75); padding: 1.2vh 2.4vw; border-radius: 1.4vh; border: .3vh solid var(--red);
                   animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { border-color: transparent; } }

  /* ---------- Results ---------- */
  #results { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
             background: radial-gradient(ellipse at 50% 30%, rgba(42, 15, 74, .93), rgba(5, 4, 12, .96)); }
  #results h2 { font-size: 5vh; margin: 0; font-weight: 500; opacity: .85; }
  #results .players { display: flex; gap: 8vw; align-items: flex-end; margin-top: 5vh; }
  #results .player { display: flex; flex-direction: column; align-items: center; gap: 1.4vh; position: relative; }
  #results .crown { font-size: 7vh; position: absolute; top: -8vh; animation: crown 1s 1.8s cubic-bezier(.2, 1.5, .4, 1) both; }
  @keyframes crown { from { transform: translateY(-5vh) scale(0); } }
  #results .who { font-size: 3.4vh; font-weight: 700; }
  #results .stars { font-size: 8vh; letter-spacing: 1vh; }
  #results .star { display: inline-block; color: rgba(255,255,255,.18); }
  #results .star.on { color: var(--gold); text-shadow: 0 0 2vh var(--gold); animation: starpop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes starpop { from { transform: scale(0) rotate(-90deg); } }
  #results .points { font-size: 8vh; font-weight: 900; }
  #results .max { font-size: 3vh; opacity: .5; font-weight: 400; margin-top: -1.5vh; }
  #results .chips { display: flex; gap: 1vw; }
  #results .chip { font-size: 2.4vh; padding: .6vh 1.2vw; border-radius: 3vh; background: rgba(255,255,255,.08); border: .25vh solid var(--c); }
  #results .chip b { color: var(--c); }
  #results .extra { font-size: 2.6vh; opacity: .75; }
  #results .buttons { display: flex; gap: 3vw; margin-top: 2vh; }
  #results .button { font-size: 3.4vh; font-weight: 700; padding: 1.5vh 3.5vw; border-radius: 5vh; border: .4vh solid rgba(255,255,255,.35);
                     transition: transform .15s, background .15s; }
  #results .button.selected { background: linear-gradient(90deg, var(--cyan), var(--pink)); border-color: transparent; transform: scale(1.08);
                              box-shadow: 0 0 3vh rgba(255, 64, 129, .5); }

  #caption { position: absolute; left: 0; right: 0; bottom: 8vh; text-align: center; font-size: 5vh; font-weight: 700;
             text-shadow: 0 .4vh 1.2vh #000; display: none; }
</style>
</head>
<body>
<video id="video"></video>
<div id="idle">
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
  <h1 class="logo">DanceApp</h1>
  <p id="status">Выберите песню на планшете</p>
  <div id="menu"></div>
  <div class="hint"></div>
</div>
<div id="progress"><div></div></div>
<div id="scores"></div>
<div id="edge"></div>
<div id="comboflash"></div>
<div id="intro"><h1></h1><p></p></div>
<div id="results"></div>
<div id="caption"></div>

<script>
const NAMESPACE = 'urn:x-cast:com.dezesar.dance';
const LEAD_MS = 3000, LINGER_MS = 600;
const COLORS = { PERFECT: '#76FF03', GOOD: '#00E5FF', OK: '#FFD740', MISS: '#FF5252' };
const LABELS = { PERFECT: 'PERFECT!', GOOD: 'GOOD', OK: 'OK', MISS: 'MISS' };
// Cue figures come as 13 points: nose, shoulders, elbows, wrists, hips, knees, ankles (left before right)
const BONES = [[1,2],[7,8],[1,7],[2,8],[1,3],[3,5],[2,4],[4,6],[7,9],[9,11],[8,10],[10,12]];
// Every this many hits in a row gets a big "COMBO n!"
const COMBO_MILESTONE = 5;

const context = cast.framework.CastReceiverContext.getInstance();
const playerManager = context.getPlayerManager();
const video = document.getElementById('video');
playerManager.setMediaElement(video);
window.addEventListener('error', e => report({ type: 'error', where: 'window', error: e.message + ' @' + e.lineno }));

const $ = id => document.getElementById(id);
const idle = $('idle'), scoresEl = $('scores'), resultsEl = $('results'), progressEl = $('progress');
const comboFlash = $('comboflash'), edge = $('edge'), intro = $('intro'), caption = $('caption');

// Restarts a CSS animation by toggling its class
function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// Counts a number up to its new value instead of jumping
function countTo(el, to, ms = 450) {
  const from = Number(el.dataset.value || 0);
  el.dataset.value = to;
  const start = performance.now();
  const step = now => {
    const f = Math.min(1, (now - start) / ms);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - f, 3)));
    if (f < 1 && Number(el.dataset.value) === to) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---------- A round: replaced by each "level" message ----------
let game = null;

function resetOverlay() {
  document.querySelectorAll('.popup, .presence, .strip, .spark').forEach(e => e.remove());
  scoresEl.innerHTML = '';
  scoresEl.style.display = 'none';
  progressEl.style.display = 'none';
  resultsEl.style.display = 'none';
  intro.classList.remove('show');
}

function startLevel(msg) {
  resetOverlay();
  caption.style.display = 'none';
  const solo = msg.players.length === 1;
  game = {
    durationMs: msg.durationMs || 0,
    players: msg.players.map(p => {
      const color = solo ? '#fff' : p.color;
      const card = document.createElement('div');
      card.className = 'scorecard';
      card.style.color = color;
      card.innerHTML = '<div class="points">0</div><div class="combo"></div>';
      scoresEl.appendChild(card);
      const popup = document.createElement('div');
      popup.className = 'popup ' + (solo ? 'solo' : p.side.toLowerCase());
      document.body.appendChild(popup);
      const presence = document.createElement('div');
      presence.className = 'presence';
      presence.style.left = solo ? '25%' : (p.side === 'LEFT' ? '0' : '50%');
      presence.innerHTML = '<span></span>';
      presence.querySelector('span').textContent = solo ? 'Встаньте в кадр' : p.label + ': встаньте в кадр';
      document.body.appendChild(presence);
      return { ...p, solo, color, judged: {}, cardEl: card, popupEl: popup, presenceEl: presence };
    }),
  };
  game.players.forEach(p => buildCues(p, msg.aspectRatio));
  scoresEl.style.display = 'flex';
  progressEl.style.display = 'block';
  idle.style.display = 'none';

  intro.querySelector('h1').textContent = msg.title || '';
  intro.querySelector('p').textContent = solo ? '' : msg.players.map(p => p.label).join('   ·   ');
  replay(intro, 'show');
}

function player(side) { return game && game.players.find(p => p.side === side); }

// Stars flying out of a PERFECT
function burst(p, color) {
  const rect = p.popupEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  for (let i = 0; i < 18; i++) {
    const spark = document.createElement('div');
    spark.className = 'spark';
    spark.textContent = i % 3 ? '✦' : '★';
    const angle = (i / 18) * 2 * Math.PI + Math.random() * .3;
    const dist = innerHeight * (.14 + Math.random() * .12);
    spark.style.cssText = `left:${cx}px;top:${cy}px;--c:${color};--dx:${Math.cos(angle) * dist}px;--dy:${Math.sin(angle) * dist}px;` +
      `--r:${Math.round(Math.random() * 360)}deg`;
    spark.addEventListener('animationend', () => spark.remove());
    document.body.appendChild(spark);
  }
}

function showJudgement(msg) {
  const p = player(msg.side);
  if (!p) return;
  const color = COLORS[msg.judgement];
  p.judged[msg.t] = msg.judgement;

  countTo(p.cardEl.querySelector('.points'), msg.points);
  replay(p.cardEl, 'bump');
  const combo = msg.combo || 0;
  const comboEl = p.cardEl.querySelector('.combo');
  comboEl.textContent = 'COMBO ' + combo;
  comboEl.classList.toggle('on', combo >= 3);

  p.popupEl.innerHTML = '<span></span>';
  p.popupEl.firstChild.textContent = LABELS[msg.judgement];
  p.popupEl.style.setProperty('--c', color);
  p.popupEl.classList.toggle('miss', msg.judgement === 'MISS');
  replay(p.popupEl, 'show');

  p.targetEl.style.setProperty('--flash', color);
  replay(p.targetEl, 'flash');

  if (msg.judgement === 'PERFECT') burst(p, color);
  if (combo > 0 && combo % COMBO_MILESTONE === 0) {
    comboFlash.innerHTML = '<span></span>';
    comboFlash.firstChild.textContent = 'COMBO ' + combo + '!';
    replay(comboFlash, 'show');
    edge.style.setProperty('--c', p.solo ? '#FFD740' : p.color);
    replay(edge, 'show');
  }
}

function showResults(msg) {
  // The round is over: only the results stay on screen
  game = null;
  document.querySelectorAll('.popup, .presence, .strip, .spark').forEach(e => e.remove());
  scoresEl.style.display = 'none';
  progressEl.style.display = 'none';
  const solo = msg.players.length === 1;
  const best = Math.max(...msg.players.map(r => r.points));
  const winners = msg.players.filter(r => r.points === best).length;
  resultsEl.innerHTML = '<h2></h2><div class="players"></div>';
  resultsEl.querySelector('h2').textContent = msg.title;
  const row = resultsEl.querySelector('.players');
  for (const r of msg.players) {
    const el = document.createElement('div');
    el.className = 'player';
    const crown = !solo && winners === 1 && r.points === best;
    el.innerHTML = (crown ? '<div class="crown">👑</div>' : '') + (solo ? '' : '<div class="who"></div>') +
      '<div class="stars"></div><div class="points">0</div><div class="max"></div><div class="chips"></div><div class="extra"></div>';
    if (!solo) { el.querySelector('.who').textContent = r.label; el.querySelector('.who').style.color = r.color; }
    const stars = el.querySelector('.stars');
    for (let i = 0; i < 5; i++) {
      const s = document.createElement('span');
      s.className = 'star' + (i < r.stars ? ' on' : '');
      s.textContent = '★';
      s.style.animationDelay = (0.5 + i * 0.25) + 's';
      stars.appendChild(s);
    }
    el.querySelector('.max').textContent = 'из ' + r.maxPoints;
    const chips = el.querySelector('.chips');
    for (const name of Object.keys(LABELS)) {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.style.setProperty('--c', COLORS[name]);
      chip.innerHTML = '<b></b> ';
      chip.firstChild.textContent = (r.counts && r.counts[name]) || 0;
      chip.appendChild(document.createTextNode(LABELS[name].replace('!', '')));
      chips.appendChild(chip);
    }
    el.querySelector('.extra').textContent = 'Лучшее комбо: ' + (r.bestCombo || 0) + (r.hint ? '   ·   ' + r.hint : '');
    row.appendChild(el);
    setTimeout(() => countTo(el.querySelector('.points'), r.points, 1400), 300);
  }
  const buttons = document.createElement('div');
  buttons.className = 'buttons';
  buttons.innerHTML = '<div class="button">Ещё раз</div><div class="button">К списку</div>';
  resultsEl.appendChild(buttons);
  resultsChoice = 0;
  renderResultsChoice();
  resultsEl.style.display = 'flex';
}

let resultsChoice = 0;
function renderResultsChoice() {
  resultsEl.querySelectorAll('.button').forEach((b, i) => b.classList.toggle('selected', i === resultsChoice));
}

function clearGame() {
  game = null;
  resetOverlay();
  caption.style.display = 'none';
  idle.style.display = 'flex';
}

// ---------- Song menu, driven by the remote: the tablet sends the list, OK sends the pick back ----------
let menu = null;
const menuEl = $('menu');
const hintEl = idle.querySelector('.hint');

function showMenu(msg) {
  const previous = menu && menu.songs[menu.selected] && menu.songs[menu.selected].id;
  menu = { songs: msg.songs, selected: 0, option: msg.songs.map(s => s.selectedOption || 0) };
  const again = msg.songs.findIndex(s => s.id === previous);
  if (again >= 0) menu.selected = again;
  $('status').textContent = msg.songs.length ? 'Выберите песню' : 'На планшете нет песен';
  hintEl.innerHTML = '<span class="key">▲▼</span> песня &nbsp; <span class="key">◀▶</span> кто танцует &nbsp; <span class="key">OK</span> начать';
  renderMenu();
}

function renderMenu() {
  menuEl.innerHTML = '';
  if (!menu) return;
  menu.songs.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'song' + (i === menu.selected ? ' selected' : '');
    const options = song.options;
    const label = options[menu.option[i]] || '';
    row.innerHTML = '<div class="meta"><span class="title"></span><span class="duration"></span></div><span class="who"></span>';
    row.querySelector('.title').textContent = song.title;
    row.querySelector('.duration').textContent = song.duration;
    row.querySelector('.who').textContent = options.length > 1 && i === menu.selected ? '◀  ' + label + '  ▶' : label;
    menuEl.appendChild(row);
  });
}

function onKey(key) {
  if (resultsEl.style.display === 'flex') {
    if (key === 'ArrowLeft' || key === 'ArrowRight') { resultsChoice = 1 - resultsChoice; renderResultsChoice(); }
    if (key === 'Enter') report({ type: resultsChoice === 0 ? 'again' : 'menu' });
    return;
  }
  if (game || !menu || !menu.songs.length || idle.style.display === 'none') return;
  const n = menu.songs.length;
  const options = menu.songs[menu.selected].options.length;
  if (key === 'ArrowDown') menu.selected = (menu.selected + 1) % n;
  if (key === 'ArrowUp') menu.selected = (menu.selected + n - 1) % n;
  if (key === 'ArrowRight') menu.option[menu.selected] = (menu.option[menu.selected] + 1) % options;
  if (key === 'ArrowLeft') menu.option[menu.selected] = (menu.option[menu.selected] + options - 1) % options;
  if (key === 'Enter') { report({ type: 'start', id: menu.songs[menu.selected].id, option: menu.option[menu.selected] }); return; }
  renderMenu();
}

// ---------- Latency calibration: the video is a metronome ----------
function showCaption(text) {
  idle.style.display = 'none';
  caption.textContent = text;
  caption.style.display = 'block';
}

context.addCustomMessageListener(NAMESPACE, event => {
  const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
  if (msg.type === 'level') {
    report({ type: 'ack', of: 'level', players: msg.players.length, cues: msg.players.map(p => p.cues.length) });
  }
  switch (msg.type) {
    case 'level': startLevel(msg); break;
    case 'judgement': showJudgement(msg); break;
    case 'presence': { const p = player(msg.side); if (p) p.presenceEl.style.display = msg.inView ? 'none' : 'block'; break; }
    case 'results': showResults(msg); break;
    case 'clear': clearGame(); break;
    case 'calibration': showCaption(msg.text); break;
    case 'menu': showMenu(msg); break;
  }
});

// ---------- Cue strips: each cue built once as an SVG figure; every frame only moves it ----------
const SVG = 'http://www.w3.org/2000/svg';

function figureSvg(points, aspect) {
  const xs = points.map(p => p[0] * aspect), ys = points.map(p => p[1]);
  const extent = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 1e-3);
  const scale = 76 / extent; // 12 % margin on each side of a 100-unit box
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const at = i => [50 + (xs[i] - cx) * scale, 50 + (ys[i] - cy) * scale];
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  for (const [a, b] of BONES) {
    const line = document.createElementNS(SVG, 'line');
    const [ax, ay] = at(a), [bx, by] = at(b);
    line.setAttribute('x1', ax); line.setAttribute('y1', ay); line.setAttribute('x2', bx); line.setAttribute('y2', by);
    svg.appendChild(line);
  }
  const [lx, ly] = at(1), [rx, ry] = at(2), [nx, ny] = at(0);
  const head = document.createElementNS(SVG, 'circle');
  head.setAttribute('cx', nx); head.setAttribute('cy', ny);
  head.setAttribute('r', Math.min(Math.max(Math.hypot(lx - rx, ly - ry) * 0.35, 5), 10));
  svg.appendChild(head);
  return svg;
}

function buildCues(p, aspect) {
  const strip = document.createElement('div');
  strip.className = 'strip';
  const target = document.createElement('div');
  target.className = 'target';
  strip.appendChild(target);
  for (const c of p.cues) {
    c.el = document.createElement('div');
    c.el.className = 'cue';
    c.el.appendChild(figureSvg(c.p, aspect));
    strip.appendChild(c.el);
  }
  document.body.appendChild(strip);
  p.targetEl = target;
}

let reportedDraw = false;
function frame() {
  try { draw(); } catch (e) { report({ type: 'error', where: 'draw', error: String(e && e.stack || e) }); game = null; }
  requestAnimationFrame(frame);
}

function draw() {
  if (!game) return;
  const now = video.currentTime * 1000;
  const duration = game.durationMs || (video.duration * 1000) || 0;
  if (duration > 0) progressEl.firstChild.style.width = Math.min(100, 100 * now / duration) + '%';
  const cue = innerHeight * 0.17;
  const stripTop = innerHeight * 0.075, stripHeight = innerHeight * 0.85;
  const targetTop = stripTop + cue * 0.25;
  const pxPerMs = (stripTop + stripHeight - targetTop) / LEAD_MS;
  for (const p of game.players) {
    const left = p.solo || p.side === 'LEFT' ? innerWidth * 0.02 : innerWidth * 0.98 - cue;
    const box = `left:${left}px;width:${cue}px;height:${cue}px;border-radius:${cue * 0.12}px;`;
    if (p.targetBox !== box) {
      // Style the target only when the layout changes, so its flash animation isn't reset every frame
      p.targetBox = box;
      p.targetEl.style.cssText = box + `top:${targetTop}px;border-width:${cue * 0.03}px;border-color:${p.color};`;
    }
    for (const c of p.cues) {
      const dt = c.t - now;
      if (dt > LEAD_MS || dt < -LINGER_MS) {
        if (c.shown) { c.el.style.display = 'none'; c.shown = false; }
        continue;
      }
      if (!reportedDraw) {
        reportedDraw = true;
        report({ type: 'drawn', now: Math.round(now), cueAt: c.t });
      }
      const judged = p.judged[c.t];
      // Cues grow a little as they near the target, as if coming at the player
      const grow = dt > 0 ? 0.85 + 0.15 * (1 - dt / LEAD_MS) : 1;
      c.el.style.cssText = box + `display:block;top:${targetTop + dt * pxPerMs}px;transform:scale(${grow});` +
        `opacity:${dt < 0 ? 1 + dt / LINGER_MS : 1};color:${judged ? COLORS[judged] : '#fff'}`;
      c.shown = true;
    }
  }
}
requestAnimationFrame(frame);

// Report back to the tablet, which logs it: the only window into the TV when debugging
function report(message) {
  try { context.sendCustomMessage(NAMESPACE, undefined, message); } catch (e) { /* no sender yet */ }
}
context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
  report({ type: 'hello', screen: innerWidth + 'x' + innerHeight, dpr: devicePixelRatio, ua: navigator.userAgent });
});
playerManager.addEventListener(cast.framework.events.EventType.ERROR, e => {
  report({ type: 'error', detailedErrorCode: e.detailedErrorCode, error: String(e.error && (e.error.message || e.error)) });
});

// The remote's D-pad and OK arrive as plain key presses (checked on the SHIELD)
document.addEventListener('keydown', e => onKey(e.key));

// Stay up between songs: the tablet decides when the session ends
const options = new cast.framework.CastReceiverOptions();
options.disableIdleTimeout = true;
options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
context.start(options);
</script>
