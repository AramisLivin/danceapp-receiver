<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DanceApp</title>
<!--
  Cast Web Receiver for DanceApp: plays the level video and draws the game on top of it.
  The tablet sends what to draw over the custom namespace below; everything time-based here
  (cues sliding to their target) runs off this device's own playback clock, so it stays in sync with the picture.
-->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Roboto, "Noto Sans", sans-serif; color: #fff; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .strip { position: absolute; inset: 0; pointer-events: none; }
  .target { position: absolute; border-style: solid; box-sizing: border-box; }
  .cue { position: absolute; display: none; background: rgba(0,0,0,.55); }
  .cue svg { width: 100%; height: 100%; stroke: currentColor; fill: currentColor; stroke-width: 6; stroke-linecap: round; }
  #idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
  #idle h1 { font-size: 7vh; margin: 0; font-weight: 700; }
  #idle p { font-size: 3vh; margin: 0; opacity: .7; }
  #menu { display: flex; flex-direction: column; gap: 1.2vh; min-width: 50vw; margin-top: 2vh; }
  #menu .song { display: flex; justify-content: space-between; align-items: center; gap: 3vw; padding: 1.6vh 2.5vw;
                border-radius: 1.5vh; background: rgba(255,255,255,.08); font-size: 3.6vh; border: .4vh solid transparent; }
  #menu .song.selected { background: rgba(255,255,255,.18); border-color: #fff; }
  #menu .who { font-size: 2.8vh; opacity: .55; }
  #menu .song.selected .who { opacity: 1; color: #FFD740; }
  .hint { font-size: 2.4vh; opacity: .55; margin-top: 2vh; }
  #results .buttons { display: flex; gap: 3vw; margin-top: 2vh; }
  #results .button { font-size: 3.4vh; padding: 1.4vh 3vw; border-radius: 4vh; border: .4vh solid rgba(255,255,255,.4); }
  #results .button.selected { background: #fff; color: #000; border-color: #fff; }
  #scores { position: absolute; top: 2vh; left: 50%; transform: translateX(-50%); display: none; gap: 4vw;
            background: rgba(0,0,0,.55); border-radius: 1.5vh; padding: 1vh 2.5vw; font-size: 6vh; font-weight: 700; }
  .popup { position: absolute; top: 20vh; width: 50%; text-align: center; font-size: 10vh; font-weight: 900;
           text-shadow: 0 .5vh 1.5vh #000; opacity: 0; }
  .popup.solo { left: 25%; }
  .popup.left { left: 0; }
  .popup.right { left: 50%; }
  .popup.show { animation: pop 1.1s ease-out forwards; }
  @keyframes pop { 0% { transform: scale(1.6); opacity: 1; } 18% { transform: scale(1); opacity: 1; } 55% { opacity: 1; } 100% { opacity: 0; } }
  .presence { position: absolute; bottom: 4vh; width: 50%; text-align: center; font-size: 3.5vh; font-weight: 700; display: none; }
  .presence span { background: rgba(0,0,0,.65); padding: 1vh 2vw; border-radius: 1vh; }
  #caption { position: absolute; left: 0; right: 0; bottom: 8vh; text-align: center; font-size: 5vh; font-weight: 700;
             text-shadow: 0 .4vh 1.2vh #000; display: none; }
  #results { position: absolute; inset: 0; background: rgba(0,0,0,.82); display: none; flex-direction: column;
             align-items: center; justify-content: center; gap: 3vh; }
  #results h2 { font-size: 5vh; margin: 0; font-weight: 400; }
  #results .players { display: flex; gap: 10vw; }
  #results .player { display: flex; flex-direction: column; align-items: center; gap: 1.5vh; }
  #results .who { font-size: 3.5vh; }
  #results .stars { font-size: 9vh; color: #FFD740; }
  #results .points { font-size: 7vh; font-weight: 700; }
  #results .counts, #results .hint { font-size: 3vh; opacity: .85; }
</style>
</head>
<body>
<video id="video"></video>
<div id="idle"><h1>DanceApp</h1><p>Выберите песню на планшете</p><div id="menu"></div><div class="hint"></div></div>
<div id="scores"></div>
<div id="results"></div>
<div id="caption"></div>

<script>
const NAMESPACE = 'urn:x-cast:com.dezesar.dance';
const LEAD_MS = 3000, LINGER_MS = 600;
const COLORS = { PERFECT: '#76FF03', GOOD: '#00E5FF', OK: '#FFD740', MISS: '#FF5252' };
// Cue figures come as 13 points: nose, shoulders, elbows, wrists, hips, knees, ankles (left before right)
const BONES = [[1,2],[7,8],[1,7],[2,8],[1,3],[3,5],[2,4],[4,6],[7,9],[9,11],[8,10],[10,12]];

const context = cast.framework.CastReceiverContext.getInstance();
window.addEventListener('error', e => report({ type: 'error', where: 'window', error: e.message + ' @' + e.lineno }));
const playerManager = context.getPlayerManager();
const video = document.getElementById('video');
playerManager.setMediaElement(video);

const idle = document.getElementById('idle');
const scoresEl = document.getElementById('scores');
const resultsEl = document.getElementById('results');

// Game state, replaced by each "level" message
let game = null; // { aspectRatio, players: [{ side, color, cues: [{t, p}], judged: {t: judgement}, points, el... }] }

function resetOverlay() {
  document.querySelectorAll('.popup, .presence, .strip').forEach(e => e.remove());
  scoresEl.innerHTML = '';
  scoresEl.style.display = 'none';
  resultsEl.style.display = 'none';
}

function startLevel(msg) {
  resetOverlay();
  const solo = msg.players.length === 1;
  game = {
    aspectRatio: msg.aspectRatio,
    players: msg.players.map(p => {
      const key = solo ? 'solo' : p.side.toLowerCase();
      const score = document.createElement('span');
      score.style.color = solo ? '#fff' : p.color;
      score.textContent = '0';
      scoresEl.appendChild(score);
      const popup = document.createElement('div');
      popup.className = 'popup ' + key;
      document.body.appendChild(popup);
      const presence = document.createElement('div');
      presence.className = 'presence';
      presence.style.left = solo ? '25%' : (p.side === 'LEFT' ? '0' : '50%');
      presence.innerHTML = '<span>' + (solo ? 'Встаньте в кадр' : p.label + ': встаньте в кадр') + '</span>';
      document.body.appendChild(presence);
      return { ...p, solo, judged: {}, scoreEl: score, popupEl: popup, presenceEl: presence };
    }),
  };
  game.players.forEach(p => buildCues(p, msg.aspectRatio));
  scoresEl.style.display = 'flex';
  idle.style.display = 'none';
}

function player(side) { return game && game.players.find(p => p.side === side); }

function showJudgement(msg) {
  const p = player(msg.side);
  if (!p) return;
  p.judged[msg.t] = msg.judgement;
  p.scoreEl.textContent = msg.points;
  p.popupEl.textContent = msg.judgement === 'PERFECT' ? 'PERFECT!' : msg.judgement;
  p.popupEl.style.color = COLORS[msg.judgement];
  p.popupEl.classList.remove('show');
  void p.popupEl.offsetWidth; // restart the animation
  p.popupEl.classList.add('show');
}

function showResults(msg) {
  // The round is over: only the results stay on screen
  game = null;
  document.querySelectorAll('.popup, .presence, .strip').forEach(e => e.remove());
  scoresEl.style.display = 'none';
  const solo = msg.players.length === 1;
  resultsEl.innerHTML = '<h2></h2><div class="players"></div>';
  resultsEl.querySelector('h2').textContent = msg.title;
  const row = resultsEl.querySelector('.players');
  for (const r of msg.players) {
    const el = document.createElement('div');
    el.className = 'player';
    el.innerHTML = (solo ? '' : '<div class="who"></div>') +
      '<div class="stars"></div><div class="points"></div><div class="counts"></div><div class="hint"></div>';
    if (!solo) { el.querySelector('.who').textContent = r.label; el.querySelector('.who').style.color = r.color; }
    el.querySelector('.stars').textContent = '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
    el.querySelector('.points').textContent = r.points + ' / ' + r.maxPoints;
    el.querySelector('.counts').textContent = r.counts;
    el.querySelector('.hint').textContent = r.hint || '';
    row.appendChild(el);
  }
  const buttons = document.createElement('div');
  buttons.className = 'buttons';
  buttons.innerHTML = '<div class="button">Ещё раз</div><div class="button">К списку</div>';
  resultsEl.appendChild(buttons);
  resultsChoice = 0;
  renderResultsChoice();
  resultsEl.style.display = 'flex';
}

let resultsChoice = 0;
function renderResultsChoice() {
  resultsEl.querySelectorAll('.button').forEach((b, i) => b.classList.toggle('selected', i === resultsChoice));
}

function clearGame() {
  game = null;
  resetOverlay();
  caption.style.display = 'none';
  idle.style.display = 'flex';
}

// Song menu, driven by the remote: the tablet sends the list, OK sends the pick back
let menu = null; // { songs: [{ id, title, duration, options: [label] }], selected, option: [per song] }
const menuEl = document.getElementById('menu');
const hintEl = idle.querySelector('.hint');

function showMenu(msg) {
  const previous = menu && menu.songs[menu.selected] && menu.songs[menu.selected].id;
  menu = { songs: msg.songs, selected: 0, option: msg.songs.map(s => s.selectedOption || 0) };
  const again = msg.songs.findIndex(s => s.id === previous);
  if (again >= 0) menu.selected = again;
  idle.querySelector('p').textContent = msg.songs.length ? 'Выберите песню пультом' : 'На планшете нет песен';
  hintEl.textContent = '▲▼ песня   ◀▶ кто танцует   OK — начать';
  renderMenu();
}

function renderMenu() {
  menuEl.innerHTML = '';
  if (!menu) return;
  menu.songs.forEach((song, i) => {
    const row = document.createElement('div');
    row.className = 'song' + (i === menu.selected ? ' selected' : '');
    const options = song.options;
    const label = options[menu.option[i]] || '';
    row.innerHTML = '<span class="title"></span><span class="who"></span>';
    row.querySelector('.title').textContent = song.title + '  ·  ' + song.duration;
    row.querySelector('.who').textContent = options.length > 1 && i === menu.selected ? '◀ ' + label + ' ▶' : label;
    menuEl.appendChild(row);
  });
}

function send(message) { report(message); }

function onKey(key) {
  if (resultsEl.style.display === 'flex') {
    if (key === 'ArrowLeft' || key === 'ArrowRight') { resultsChoice = 1 - resultsChoice; renderResultsChoice(); }
    if (key === 'Enter') send({ type: resultsChoice === 0 ? 'again' : 'menu' });
    return;
  }
  if (game || !menu || !menu.songs.length || idle.style.display === 'none') return;
  const n = menu.songs.length;
  const options = menu.songs[menu.selected].options.length;
  if (key === 'ArrowDown') menu.selected = (menu.selected + 1) % n;
  if (key === 'ArrowUp') menu.selected = (menu.selected + n - 1) % n;
  if (key === 'ArrowRight') menu.option[menu.selected] = (menu.option[menu.selected] + 1) % options;
  if (key === 'ArrowLeft') menu.option[menu.selected] = (menu.option[menu.selected] + options - 1) % options;
  if (key === 'Enter') { send({ type: 'start', id: menu.songs[menu.selected].id, option: menu.option[menu.selected] }); return; }
  renderMenu();
}

// Latency calibration: the video is a metronome; the tablet tells players what to do and how it's going
const caption = document.getElementById('caption');
function showCaption(text) {
  idle.style.display = 'none';
  caption.textContent = text;
  caption.style.display = 'block';
}

context.addCustomMessageListener(NAMESPACE, event => {
  const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
  if (msg.type === 'level') {
    report({ type: 'ack', of: 'level', players: msg.players.length, cues: msg.players.map(p => p.cues.length) });
  }
  switch (msg.type) {
    case 'level': startLevel(msg); break;
    case 'judgement': showJudgement(msg); break;
    case 'presence': { const p = player(msg.side); if (p) p.presenceEl.style.display = msg.inView ? 'none' : 'block'; break; }
    case 'results': showResults(msg); break;
    case 'clear': clearGame(); break;
    case 'calibration': showCaption(msg.text); break;
    case 'menu': showMenu(msg); break;
  }
});

// Cue strips. Plain elements, not a canvas: on Android TV Cast devices the video plane covers canvases.
// Each cue is built once as an SVG figure; every frame only moves it, timed off the video's own clock.
const SVG = 'http://www.w3.org/2000/svg';

function figureSvg(points, aspect) {
  const xs = points.map(p => p[0] * aspect), ys = points.map(p => p[1]);
  const extent = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys), 1e-3);
  const scale = 76 / extent; // 12 % margin on each side of a 100-unit box
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
  const at = i => [50 + (xs[i] - cx) * scale, 50 + (ys[i] - cy) * scale];
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  for (const [a, b] of BONES) {
    const line = document.createElementNS(SVG, 'line');
    const [ax, ay] = at(a), [bx, by] = at(b);
    line.setAttribute('x1', ax); line.setAttribute('y1', ay); line.setAttribute('x2', bx); line.setAttribute('y2', by);
    svg.appendChild(line);
  }
  const [lx, ly] = at(1), [rx, ry] = at(2), [nx, ny] = at(0);
  const head = document.createElementNS(SVG, 'circle');
  head.setAttribute('cx', nx); head.setAttribute('cy', ny);
  head.setAttribute('r', Math.min(Math.max(Math.hypot(lx - rx, ly - ry) * 0.35, 5), 10));
  svg.appendChild(head);
  return svg;
}

function buildCues(p, aspect) {
  const strip = document.createElement('div');
  strip.className = 'strip';
  const target = document.createElement('div');
  target.className = 'target';
  target.style.borderColor = p.solo ? 'rgba(255,255,255,.9)' : p.color;
  strip.appendChild(target);
  for (const c of p.cues) {
    c.el = document.createElement('div');
    c.el.className = 'cue';
    c.el.appendChild(figureSvg(c.p, aspect));
    strip.appendChild(c.el);
  }
  document.body.appendChild(strip);
  p.stripEl = strip;
  p.targetEl = target;
}

let reportedDraw = false;
function frame() {
  try { draw(); } catch (e) { report({ type: 'error', where: 'draw', error: String(e && e.stack || e) }); game = null; }
  requestAnimationFrame(frame);
}

function draw() {
  if (!game) return;
  const now = video.currentTime * 1000;
  const cue = innerHeight * 0.17;
  const stripTop = innerHeight * 0.075, stripHeight = innerHeight * 0.85;
  const targetTop = stripTop + cue * 0.25;
  const pxPerMs = (stripTop + stripHeight - targetTop) / LEAD_MS;
  for (const p of game.players) {
    const left = p.solo || p.side === 'LEFT' ? innerWidth * 0.02 : innerWidth * 0.98 - cue;
    p.targetEl.style.cssText = `left:${left}px;top:${targetTop}px;width:${cue}px;height:${cue}px;border-width:${cue * 0.03}px;` +
      `border-color:${p.solo ? 'rgba(255,255,255,.9)' : p.color};border-radius:${cue * 0.12}px`;
    for (const c of p.cues) {
      const dt = c.t - now;
      if (dt > LEAD_MS || dt < -LINGER_MS) {
        if (c.shown) { c.el.style.display = 'none'; c.shown = false; }
        continue;
      }
      if (!reportedDraw) {
        reportedDraw = true;
        report({ type: 'drawn', now: Math.round(now), cueAt: c.t });
      }
      const judged = p.judged[c.t];
      c.el.style.cssText = `display:block;left:${left}px;top:${targetTop + dt * pxPerMs}px;width:${cue}px;height:${cue}px;` +
        `border-radius:${cue * 0.12}px;opacity:${dt < 0 ? 1 + dt / LINGER_MS : 1};color:${judged ? COLORS[judged] : '#fff'}`;
      c.shown = true;
    }
  }
}
requestAnimationFrame(frame);

// Report back to the tablet, which logs it: the only window into the TV when debugging
function report(message) {
  try { context.sendCustomMessage(NAMESPACE, undefined, message); } catch (e) { /* no sender yet */ }
}
context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, () => {
  report({ type: 'hello', screen: innerWidth + 'x' + innerHeight, dpr: devicePixelRatio, ua: navigator.userAgent });
});
playerManager.addEventListener(cast.framework.events.EventType.ERROR, e => {
  report({ type: 'error', detailedErrorCode: e.detailedErrorCode, error: String(e.error && (e.error.message || e.error)) });
});

// The remote's D-pad and OK arrive as plain key presses (checked on the SHIELD)
document.addEventListener('keydown', e => onKey(e.key));

// Stay up between songs: the tablet decides when the session ends
const options = new cast.framework.CastReceiverOptions();
options.disableIdleTimeout = true;
options.customNamespaces = { [NAMESPACE]: cast.framework.system.MessageType.JSON };
context.start(options);
</script>
</body>
</html>
