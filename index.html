<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DanceApp</title>
<!--
  Cast Web Receiver for DanceApp: plays the level video and draws the game on top of it.
  The tablet sends what to draw over the custom namespace below; everything time-based here
  (cues sliding to their target, the progress bar) runs off this device's own playback clock,
  so it stays in sync with the picture.
  Everything is plain elements: on Android TV Cast devices the video plane covers <canvas>.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap&subset=cyrillic" rel="stylesheet">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<video id="video"></video>
<!-- Menu, as on the tablet: the song list with a silent preview, then line-up posters -->
<div id="idle">
  <div id="disco"></div>
  <header>
    <div class="back"><svg viewBox="0 0 20 20"><path d="M13 2.4 L6 10 L13 17.6"/></svg></div>
    <h1 class="logo">DanceApp</h1>
    <h1 class="title"></h1>
  </header>
  <p id="status">Выберите песню на планшете</p>
  <section id="songs">
    <div id="list"></div>
    <div id="preview">
      <div class="screen"><video id="preview-video" muted playsinline></video></div>
      <div class="info">
        <div><h2></h2><div class="facts"></div></div>
        <div class="pill">Танцевать</div>
      </div>
    </div>
  </section>
  <section id="lineups"></section>
  <footer class="hint"></footer>
</div>
<div id="progress"><div></div></div>
<div id="scores"></div>
<div id="edge"></div>
<div id="comboflash"></div>
<div id="lobby"><div class="flash"></div><h1></h1><p></p><div class="places"></div><div class="ripple"></div><div class="count"></div><div class="hint"><span class="key">OK</span>начать сразу</div></div>
<div id="intro"><h1></h1><p></p></div>
<div id="results"></div>
<div id="caption"></div>
<div id="toast">Нажмите «Назад» ещё раз, чтобы выйти</div>

<!-- Bump ?v= on every change: the TV may otherwise keep an old script next to a new page -->
<script src="common.js?v=13"></script>
<script src="figure.js?v=13"></script>
<script src="game.js?v=13"></script>
<script src="menu.js?v=13"></script>
<script src="main.js?v=13"></script>
</body>
</html>
